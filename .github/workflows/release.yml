name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm >= 11.5.1; no npm token is stored.
      - run: npm install -g npm@latest
      # Runs after GoReleaser so the release binaries the launcher downloads exist.
      - name: Build npm package
        run: node npm/build.mjs "${GITHUB_REF_NAME}"
      - name: Publish npm package
        run: |
          spec="$(node -p "const p=require('./dist/npm/ocws/package.json'); p.name+'@'+p.version")"
          if npm view "$spec" version >/dev/null 2>&1; then
            echo "$spec already published; skipping"
          else
            npm publish dist/npm/ocws --access public
          fi

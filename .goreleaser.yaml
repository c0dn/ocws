# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: ocws

builds:
  - main: ./cmd/ocws
    binary: ocws
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]

archives:
  # Raw binaries so the npm postinstall fallback can download without unpacking.
  - id: raw
    formats: [binary]
    name_template: "ocws_{{ .Os }}_{{ .Arch }}"
  - id: tarballs
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "ocws_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  use: github
